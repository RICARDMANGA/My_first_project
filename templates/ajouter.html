<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, install-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='ajout.css') }}">

        <title>Ajouter un Contact</title>
    </head>
    <body>

        {% extends "base.html" %}

{% block content %}
<div class="form-container-wrapper">
    <h1>Ajouter un Contact</h1>
    <form id="contactForm" action="{{url_for('ajouter')}}" method="post" novalidate>
         <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <h2>Contactez-nous</h2>

        <div class="form-group">
            <label for="prenom">Prénom :</label>
            <input type="text" placeholder="Prénom" id="prenom" name="prenom">
            <span class="error-message" id="prenomError"></span>
        </div>

        <div class="form-group">
            <label for="nom">Nom :</label>
            <input type="text" placeholder="Nom" id="nom" name="nom">
            <span class="error-message" id="nomError"></span>
        </div>

        <div class="form-group">
            <label for="age">Âge :</label>
            <input type="number" placeholder="Age" id="age" name="age">
            <span class="error-message" id="ageError"></span>
        </div>

        <div class="form-group">
            <label for="address">Adresse :</label>
            <input type="text" placeholder="Address" id="address" name="address">
            <span class="error-message" id="addressError"></span>
        </div>

        <div class="form-group">
            <label for="telephone">Téléphone :</label>
            <input type="text" placeholder="Téléphone" id="telephone" name="telephone">
            <span class="error-message" id="telephoneError"></span>
        </div>

        <button type="submit">Ajouter</button>
    </form>
    <div class="mt-3 text-center">
        <a href="/"><button class="back-btn">Retour à la page principale</button></a>
    </div>
</div>

<!-- Inclusion du script JS de validation -->
<script src="{{ url_for('static', filename='ajout.js') }}"></script>
{% endblock %}


</body>
</html>
