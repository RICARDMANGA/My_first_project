<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='modifier_utilisateurs.css') }}">

    <title>Modifier un Contact</title>
</head>
<body>
    


{% extends "base.html" %}

{% block title %}Modifier l'utilisateur{% endblock %}

{% block content %}
<div class="container mt-5 ">
    <h2>Modifier l'utilisateur</h2>
    <form action="{{ url_for('modifier_utilisateur', user_id=utilisateur._id) }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="username">Prénom d'utilisateur</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ utilisateur.username }}" readonly required>
        </div>
        <div class="form-group">
            <label for="nom">Nom d'utilisateur</label>
            <input type="text" class="form-control" id="nom" name="nom" value="{{ utilisateur.nom }}" required>
        </div>
        <div class="form-group">
            <label for="role">Rôle</label>
            <select class="form-control" id="role" name="role">
                <option value="user" {% if utilisateur.role == 'user' %}selected{% endif %}>Utilisateur</option>
                <option value="admin" {% if utilisateur.role == 'admin' %}selected{% endif %}>Administrateur</option>
            </select>
        </div>
        <!-- <hr>
        <h4>Réinitialiser le mot de passe</h4>
        <div class="form-group">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <label for="password">Nouveau mot de passe (laissez vide pour ne pas changer)</label>
            <input type="password" class="form-control" id="password" name="password">
        </div> -->
        <button type="submit" class="btn btn-primary mt-3">Mettre à jour l'utilisateur</button>
        <a href="{{ url_for('liste_utilisateurs') }}" class="btn btn-secondary mt-3">Annuler</a>
    </form>
</div>
{% endblock %}

</body>
</html>
