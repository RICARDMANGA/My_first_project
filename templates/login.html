

{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Connexion</h3>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form action="{{ url_for('login') }}" method="post">
                        <div class="form-group">
                            <label for="username">Nom d'utilisateur</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Mot de passe</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-3">Se connecter</button>
                    </form>
                </div>
 <!--                <div class="card-footer text-center">
    <small>Vous n'avez pas de compte ? <a href="{{ url_for('signup') }}">Inscrivez-vous ici</a></small><br>
    <small><a href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a></small>
</div>
 -->
            </div>
        </div>
    </div>
</div>
{% endblock %}
