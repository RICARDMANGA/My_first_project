<!doctype html>
<html lang="fr">
<head>
    <!-- Méta-tags essentiels -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Votre fichier CSS personnalisé doit venir après Bootstrap -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">


</head>
<body class="d-flex flex-column">





{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Connexion</h3>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form action="{{ url_for('login') }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="form-group">
                            <label for="username">Nom d'utilisateur</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Mot de passe</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-3">Se connecter</button>
                    </form>
                </div>
 <!--                <div class="card-footer text-center">
    <small>Vous n'avez pas de compte ? <a href="{{ url_for('signup') }}">Inscrivez-vous ici</a></small><br>
    <small><a href="{{ url_for('forgot_password') }}">Mot de passe oublié ?</a></small>
</div>
 -->
            </div>
        </div>
    </div>
</div>
{% endblock %}


</body>
</html>
