<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, install-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='ajouter_utilisateurs.css') }}">

        <title>Ajouter un Contact</title>
    </head>
    <body>


{% extends "base.html" %}

{% block title %}Ajouter un Utilisateur{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Ajouter un Utilisateur</h2>
    <form action="{{ url_for('ajouter_utilisateur') }}" method="post">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="role">Rôle</label>
            <select class="form-control" id="role" name="role">
                <option value="user">Utilisateur</option>
                <option value="admin">Administrateur</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary mt-3">ajouter_utilisateur</button>
        <a href="{{ url_for('liste_utilisateurs') }}" class="btn btn-secondary mt-3">Annuler</a>
    </form>
</div>
{% endblock %}


</body>
</html>
