<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, install-scale=1.0">
        
    <title>Modifier un contact</title>
    <!-- Lien vers le fichier CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='modify.css') }}">
</head>
<body>

     {% extends "base.html" %}

         
         {% block content %}
    <div class="form-container-wrapper">
    <h1>Modifier un contact</h1>
     <form action="{{url_for('modifier_item', item_id=item._id)}}" method="post">  <!-- action et method sont des attributs importants -->


         <div class="form-group">
            <label for="prenom">Prenom :</label>
            <input type="text" id="prenom" name="prenom" value="{{item.Prenom}}" required> <br>
        </div>

        <div class="form-group">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" value="{{item.Nom}}" required>
        </div>

         <div class="form-group">
            <label for="age">Age :</label>
            <input type="number" id="age" name="age" value="{{item.Age}}" required>
        </div>

        <div class="form-group">
            <label for="address">Adress :</label>
            <input type="address" id="address" name="address" value="{{item.Address}}" required>
        </div>

         <div class="form-group">
            <label for="telephone">Telephone :</label>
            <input type="text" id="telephone" name="telephone" value="{{item.Telephone}}" required>
        </div>

       

        <button type="submit">Modifier</button>
    </form>
    <!-- <a href="{{ url_for('afficher_donnees') }}"></a>
    <a href="/"><button class="delete-btn" >Retour à la page principale</button></a> -->
     <!-- <a href="{{ url_for('afficher_donnees') }}">
        <button class="back-btn">Retour à la page principale</button>
    </a> -->
    <div class="mt-3 text-center">
        <a href="{{ url_for('afficher_donnees') }}"></a>
        <a href="/"><button class="back-btn">Retour à la page principale</button></a>
    </div>
    </div>
     {% endblock %}
</body>
</html>
