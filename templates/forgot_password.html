{% extends "base.html" %}

{% block title %}Mot de passe oublié{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Mot de passe oublié</h2>
    <form action="{{ url_for('forgot_password') }}" method="post">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="security_answer">Réponse à la question de sécurité (par exemple, "votre couleur préférée")</label>
            <input type="text" class="form-control" id="security_answer" name="security_answer" required>
        </div>
        <div class="form-group">
            <label for="new_password">Nouveau mot de passe</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Réinitialiser le mot de passe</button>
    </form>
</div>
{% endblock %}
